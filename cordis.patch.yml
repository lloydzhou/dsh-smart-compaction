# Bundle-owned startup plumbing: disabling the whole bundle removes this override
# and both inserted rows, restoring the host's native standard registration.
- id: preset-standard
  disabled: true
- insert:
    - id: smart-compaction-preset-adapter
      # Keep enabled: selects smart/native standard from the root switch at startup.
      # This is not a separate user feature. Switch changes require a Web restart.
      name: dsh-smart-compaction/preset
    - id: smart-compaction-integration
      # User-facing enable switch and client discovery; never a global engine.
      name: dsh-smart-compaction
      config:
        integration: true
